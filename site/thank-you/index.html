<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Thank You | LOOC Insight</title>
<style>
 body{margin:0;font-family:'Nunito Sans','Helvetica Neue',Arial,sans-serif;background:#f7f8fa;color:#1a2b49;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
 .card{max-width:520px;padding:56px 32px}
 .check{width:76px;height:76px;border-radius:50%;background:#1a2b49;display:flex;align-items:center;justify-content:center;margin:0 auto 28px}
 .check svg{width:38px;height:38px;stroke:#fff;stroke-width:3;fill:none}
 h1{font-size:26px;font-weight:600;margin:0 0 14px}
 p{font-size:16px;line-height:1.8;color:#556;margin:0 0 32px}
 a.btn{display:inline-block;background:#1a2b49;color:#fff;text-decoration:none;padding:14px 34px;border-radius:6px;font-size:15px;transition:opacity .2s}
 a.btn:hover{opacity:.85}
</style>
<link rel="stylesheet" href="/assets/site-fixes.css">
<style id="loocinsight-hide-search">/* remove non-functional search (static) */.vamtam-search-form,.elementor-widget-search-form,.vamtam-theme-search,form.elementor-search-form,form[role="search"]{display:none!important}</style>
<link rel="canonical" href="https://loocinsight.com/thank-you/">
</head>
<body>
 <div class="card">
  <div class="check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
  <h1>Thank you for reaching out</h1>
  <p>We have received your message. A member of our team will be in touch with you shortly.</p>
  <a class="btn" href="/">Back to Home</a>
 </div>
<script src="/assets/site-fixes.js" defer></script>
</body>
</html>
